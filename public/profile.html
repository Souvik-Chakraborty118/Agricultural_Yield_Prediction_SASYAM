<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SASYAM - Profile</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/assets/logo.png" alt="SASYAM logo" class="brand-logo">
      <div>
        <strong>SASYAM</strong>
        <span data-i18n="brandSub">Analytical Engine</span>
      </div>
    </div>
    <nav>
      <select id="languageSelect" class="language-select">
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
      </select>
      <button id="navHome" class="nav-button" data-i18n="home">Home</button>
      <button id="navCalculator" class="nav-button" data-i18n="calculator">Calculator</button>
      <button class="nav-button" disabled data-i18n="profile">Profile</button>
    </nav>
  </header>

  <main class="glass-effect-section">
    <div class="profile-container glass-effect-panel mx-auto mt-40">
      <h2 data-i18n="profile">Profile</h2>
      <div class="profile-card">
        <div class="profile-info mb-16">
          <p><strong>SASYAM ID:</strong> <span id="profileIdDisplay"></span></p>
          <p><strong>Created:</strong> <span id="profileDateDisplay"></span></p>
        </div>
        
        <div class="edit-profile-section">
          <h3 data-i18n="editProfile">Edit Profile</h3>
          
          <div class="form-group mb-10">
            <label>Name:</label>
            <input type="text" id="editName" placeholder="Full Name">
          </div>
          
          <div class="form-group mb-10">
            <label>Email:</label>
            <input type="email" id="editEmail" class="readonly-input" readonly>
          </div>
          
          <div class="form-group mb-10">
            <label>Age:</label>
            <input type="number" id="editAge" placeholder="Age" min="1" max="150">
          </div>
          
          <div class="form-group mb-10">
            <label>Mobile Number:</label>
            <input type="tel" id="editPhone" placeholder="10-digit mobile number" pattern="[0-9]{10}">
          </div>
          
          <div class="form-group mb-10">
            <label>Farm Location:</label>
            <input type="text" id="editFarmLocation" class="readonly-input" readonly>
          </div>
          
          <div class="profile-actions">
            <button id="saveProfileBtn" class="primary-action">Save Changes</button>
            <button id="logoutBtn" class="secondary-action full-width mt-12" data-i18n="logout">Logout</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
